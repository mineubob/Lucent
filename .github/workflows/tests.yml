name: PHP Tests
on:
  workflow_call:
  workflow_dispatch:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
        dependencies: ["highest", "lowest"]

    services:
      mysql:
        image: mysql:lts
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: test_database
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, pdo_mysql
          tools: composer:v2
          coverage: xdebug

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.os }}-php${{ matrix.php }}-deps${{ matrix.dependencies }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php }}-deps${{ matrix.dependencies }}-

      - name: Install dependencies
        run: |
          composer update --no-interaction --prefer-dist ${{ matrix.dependencies == 'lowest' && '--prefer-lowest' || '' }}
          composer dump-autoload

      - name: Run tests
        run: |
          php vendor/bin/phpunit --configuration phpunit.xml --no-progress --display-deprecations --display-warnings --no-coverage
        env:
          DB_DRIVER: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: test_database
          DB_USER: root
          DB_PASSWORD: testpassword

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-data-php${{ matrix.php }}-${{ matrix.dependencies }}
          path: temp_install/
